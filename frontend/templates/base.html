{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tarnished’s Codex{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/codex.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="bar">
    <a class="logo" href="{% url 'mapa' %}"><img src="{% static 'img/emblema.png' %}" alt="" width="16" height="20">Tarnished’s Codex</a>
    <nav class="nav">
      <a href="{% url 'mapa' %}" {% if request.resolver_match.url_name == 'mapa' %}class="on"{% endif %}>Mapa</a>
      <a href="{% url 'acerca' %}" {% if request.resolver_match.url_name == 'acerca' %}class="on"{% endif %}>Acerca de</a>
      <a class="btn sm" href="{% url 'admin:index' %}">Admin</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
